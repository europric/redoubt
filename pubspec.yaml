name: redoubt
description: "Redoubt — an air-gapped Ethereum cold wallet that signs transactions via BC-UR QR codes, with no network access."
publish_to: "none"
version: 0.1.2+3

environment:
  sdk: ^3.12.0

dependencies:
  blockchain_utils: ^7.1.0
  cbor: ^6.1.0
  crypto: ^3.0.7
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_secure_storage: 11.0.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  local_auth: ^2.3.0
  local_auth_platform_interface: ^1.1.0
  meta: ^1.18.0
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  unorm_dart: ^0.3.2

dev_dependencies:
  custom_lint: ^0.8.0
  flutter_lints: ^6.0.0
  flutter_secure_storage_platform_interface: ^2.0.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  test: ^1.25.0
  wallet_lints:
    path: tool/wallet_lints

flutter:
  uses-material-design: true

  # `google_fonts` resolves bundled fonts by scanning the asset manifest
  # for `{Family}-{Variant}.ttf` naming — this is NOT the pubspec `fonts:`
  # block (that mechanism is for BYPASSING google_fonts entirely).
  # `brand-theme` spec's "Typography Loaded Offline" requirement / design.md
  # D4: exactly 4 static weights, matching what AppTheme's TextTheme (D5)
  # actually references.
  assets:
    - assets/google_fonts/
