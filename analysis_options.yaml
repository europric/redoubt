analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Separate nested package (own pubspec.yaml/deps) — analyzed on its own,
    # not as part of this package's analysis context (task 1.5 spike).
    - tool/wallet_lints/**
  # Optional editor-only custom_lint plugin (task 1.5 spike). Purely
  # additive — tool/check_architecture.dart is the mandatory CI gate
  # regardless of whether this loads in a given editor/CI environment.
  plugins:
    - custom_lint
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_literals_to_create_immutables
    - prefer_const_declarations
    # Hexagonal-architecture-refactor tooling hardening (PR1, task 1.4).
    # R3 (import ordering) is delegated to this built-in, auto-fixable rule
    # instead of a custom one — see design.md D2.
    - directives_ordering
    - avoid_relative_lib_imports
    - implementation_imports
    - depend_on_referenced_packages
    - dangling_library_doc_comments
