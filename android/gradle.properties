org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template.
#
# Flipped to true after upgrading to Flutter 3.47.0 stable, which fixes
# FlutterPluginUtils.detectApplyingKotlinGradlePlugin() unconditionally
# force-applying the legacy "kotlin-android" plugin as a detection probe on
# every android-library/application subproject (including pure-Java plugins
# with no Kotlin source, e.g. flutter_plugin_android_lifecycle) -- that probe
# used to trip AGP 9's built-in-Kotlin guard rail and break the build (see
# https://github.com/flutter/flutter/issues/181383). Verified working here:
# `flutter build apk --release` succeeds with no "plugins that apply KGP"
# warning, `flutter analyze` clean, full test suite green.
android.builtInKotlin=true
