name: Bump version

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  propose-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Compute bump and open release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail

          if gh pr list --state open --json headRefName --jq '.[].headRefName' | grep -q '^release/'; then
            echo "A release PR is already open — skipping until it merges."
            exit 0
          fi

          CURRENT=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')
          CURRENT_SEMVER="${CURRENT%%+*}"
          CURRENT_BUILD="${CURRENT##*+}"

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag — bootstrapping baseline tag v$CURRENT_SEMVER (no version change)."
            git tag "v$CURRENT_SEMVER"
            git push origin "v$CURRENT_SEMVER"
            exit 0
          fi

          BUMP="none"
          while read -r sha; do
            msg=$(git log -1 --pretty=%B "$sha")
            subject=$(echo "$msg" | head -1)
            if echo "$msg" | grep -q "BREAKING CHANGE:" || echo "$subject" | grep -qE '^[a-zA-Z]+(\(.+\))?!:'; then
              BUMP="major"
              break
            elif echo "$subject" | grep -qE '^feat(\(.+\))?:' && [ "$BUMP" != "major" ]; then
              BUMP="minor"
            elif echo "$subject" | grep -qE '^fix(\(.+\))?:' && [ "$BUMP" = "none" ]; then
              BUMP="patch"
            fi
          done < <(git log "$LAST_TAG"..HEAD --pretty=%H)

          if [ "$BUMP" = "none" ]; then
            echo "No feat/fix/breaking commits since $LAST_TAG — nothing to bump."
            exit 0
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_SEMVER"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_BUILD=$((CURRENT_BUILD + 1))
          NEW_SEMVER="$MAJOR.$MINOR.$PATCH"
          NEW_VERSION="$NEW_SEMVER+$NEW_BUILD"
          BRANCH="release/v$NEW_SEMVER"

          sed -i "s/^version:.*/version: $NEW_VERSION/" pubspec.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pubspec.yaml
          git commit -m "chore: release v$NEW_SEMVER"
          git push origin "$BRANCH"

          gh pr create --title "chore: release v$NEW_SEMVER" \
            --body "Automated version bump ($BUMP): $CURRENT_SEMVER -> $NEW_SEMVER (build $NEW_BUILD). Merge manually (squash) once private-tests passes — keep \`[skip ci]\` in the squash commit subject to skip a pointless re-run." \
            --base main --head "$BRANCH"

  finalize-release:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.head_ref }}"
          TAG="v${TAG#release/v}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --generate-notes
